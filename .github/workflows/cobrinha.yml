name: Atualizar README

on:
  schedule: # a cada 12 horas
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    name: Cobrinha de contribuições
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Moraeszz2
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/snake-blood.svg?color_snake=#e11d48&color_dots=#160b10,#4c0519,#881337,#be123c,#f43f5e&color_background=#0a0508

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  svgs:
    name: SVGs do README (repositórios, rodapé)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images scripts/assets/repo-cache.json
          git diff --cached --quiet || (git commit -m "chore: atualiza SVGs do README" && git push)
